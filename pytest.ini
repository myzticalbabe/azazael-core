[pytest]
minversion = 7.0
testpaths = tests

# ── Stray auto-loaded plugins (2026-09-12) ───────────────────────────────────
# pytest auto-loads EVERY `pytest11` entry point in the environment, whether or
# not this project uses it. Three of them import a BINARY dependency at module
# level, so on a free-threaded interpreter they abort COLLECTION -- before a
# single test runs -- and the suite could not execute at all:
#
#   fugue_test / fugue_test_fixtures  -> `import pyarrow as pa`, and the wheel in
#        site-packages is a GIL-ABI build. A free-threaded interpreter loads only
#        `t`-suffixed extension modules (verified via EXTENSION_SUFFIXES), so
#        `pyarrow.lib` is permanently missing there. TWO entry points are needed
#        because `fugue_test.fixtures` re-imports the `fugue_test` package, so
#        disabling only the first still runs its `__init__`.
#   langsmith_plugin                  -> `pydantic_core._pydantic_core`, the same
#        ABI mismatch.
#
# Measured 2026-09-12 on the then-current 3.14t interpreter: of the 7 `pytest11`
# plugins exactly these 3 failed to import; anyio, pytest_cov, typeguard and
# hydra_pytest all load. The ABI rule is per-minor, so the flags carry over to
# production 3.15t (2026-10-19) -- that is a carried measurement, not a fresh
# one, and it is owed on 3.15t before anyone deletes these flags.
# None of the three is imported anywhere in src/, scripts/ or tests/.
#
# `-p no:<name>` is harmless when a plugin is absent, so this file is safe on an
# environment that does not have them. Delete these flags only if those packages
# are ever installed with free-threaded wheels.
#
# Measured 2026-10-20 on production 3.15t: installed pytest11 entry points are
# only anyio/hypothesispytest/timeout/xdist(+looponfail) - none of the three
# broken packages is present, and the suite runs green with the flags removed
# (`-o addopts="-n auto"`: 103 passed). The flags are a no-op here and are
# KEPT as armor for other interpreters, which may still carry the GIL-ABI
# wheels; deleting them needs per-environment evidence, not this measurement.
# ── `-n auto` removed from the committed addopts (2026-10-30) ───────────────
# Measured on Python 3.14.7 (Windows, pytest 9.0.3): `pytest` could not start --
#
#   ERROR: pytest: error: unrecognized arguments: -n
#   inifile: C:\Azazael\azazael\pytest.ini
#
# because `pip show pytest-xdist` reports the package is absent on that
# interpreter. The failure happens during argument parsing, BEFORE collection,
# so the suite reported nothing at all -- not a skip, not a failure.
#
# A committed flag must be satisfiable by every interpreter that reads this
# file. Parallelism is therefore opt-in per environment:
#
#   pytest -n auto          # where pytest-xdist is installed (3.15t)
#   AZAZAEL_PYTEST_N=auto   # not wired; use the flag, not an env guess
#
# Serial cost measured the same day: src/tests 30.8 s, src/CODEX/TESTING 7.3 s.
addopts =
    -p no:fugue_test -p no:fugue_test_fixtures -p no:langsmith_plugin

# ── Every test is bounded (2026-10-30) ──────────────────────────────────────
# Why this exists: no full-suite run had EVER completed here, and the cause was
# not slowness -- it was the absence of a ceiling. One blocking test wedged the
# remaining 5,380 with nothing to stop it. The hang was real (governance.py:791
# fetched 5.4 GB of memory rows to compare two ledgers); the missing bound was
# the other half, and it existed all along:
#
#   C:/Azazael/.venvs/py315t  pytest 9.1.1 + pytest-timeout 2.4.0 + xdist 3.8.0
#   `--timeout=2` on a 5s sleep  ->  "+++ Timeout +++"        MEASURED 2026-10-30
#
# timeout_method = thread is deliberate, not default-by-accident: the thread
# method dumps the stacks of the whole process, and a stack dump is what named
# `governance.py:791 _read_memory_events <- cross_validate` in one run instead
# of a session of guessing. The "signal" method would kill only the test.
#
# faulthandler_timeout is a CORE pytest option (no plugin needed) and fires
# first, so every interpreter that reads this file gets a traceback for a hang
# even where pytest-timeout is absent. Verified on Python 3.14.7 (pytest 9.0.3)
# with no timeout plugin installed: the two plugin keys warn
# (`PytestConfigWarning: Unknown config option`) and the suite still runs -- the
# same failure mode `-n` had is NOT possible here, because `-n` fails during
# argument parsing while an unknown ini key only warns. pytest-timeout is now
# installed on both interpreters so the warning is also gone in practice.
timeout = 120
timeout_method = thread
faulthandler_timeout = 20

# ── File exclusions removed (2026-10-03) ─────────────────────────────────────
# Between 2026-10-02 and 2026-10-03 six files were `--ignore`d: five because a
# bare `pytest` reached them and hung past a 90 s-per-file budget, and
# tests/test_sprt_remeasurement.py because the compliance gate refused its
# module import (PermissionError: CRITICAL: Unauthorized).
#
# All seven now run to completion in the default suite. Measured alone, with
# `-p no:hypothesispytest`:
#
#   test_cluster_integration_p1.py      21 passed,  30 s
#   test_clusterworms_integration.py    15 passed,   7 s
#   test_clusterworms_unit.py          106 passed,  49 s
#   test_metacluster_orchestration.py   23 passed,  10 s
#   test_worm_regression.py             11 passed,   4 s
#   test_worm_regression_smoke.py       11 passed,  13 s
#   test_sprt_remeasurement.py          18 passed, 0.2 s
#
# The hangs were fixed by the cluster/CLUSTERWORMS work (the unit file already
# documents the subprocess-timeout fix for its 15 execution tests); the gate no
# longer refuses test_sprt_remeasurement. Re-adding an `--ignore` here needs a
# fresh measurement, not the stale 2026-10-02 note.

# ── Marker registration (2026-09-22) ────────────────────────────────────────
# `pytest.mark.slow` is applied 9 times and was never registered, so every run
# emitted `PytestUnknownMarkWarning` and pytest printed the mark as unknown in
# the warning summary -- measured on the aggregate suite, twice per run
# (test_inference_integration.py:976, test_parallel_integration.py:39 and 112).
#
# It matters beyond tidiness: two files already REASON about this marker by
# name. `test_parallel_integration.py:450` and `test_inference_integration.py:1054`
# both walk `obj.__pytestmark__` looking for a mark whose name is "slow", so if
# the name is ever typo'd the marker silently stops being applied and those two
# checks quietly stop excluding the slow tests instead of failing.
#
# Registering it is what `--strict-markers` would have demanded; the flag itself
# is not enabled, because enabling it turns every unregistered mark in the
# existing suite into a collection error and that is a separate change.
markers =
    slow: long-running test (heavy imports, real subprocesses, benchmarks); two suites filter on this name
    nuitka_incompatible: cannot run under Nuitka compiled (.exe or --module) mode (see conftest/CD4)
    env: needs live environment (sockets, GPU, Ollama, browser, or production ledger); fails without it, not on regression
    order: order-dependent within file or suite (global registry, daemon heartbeat, singleton clock); run in file order
