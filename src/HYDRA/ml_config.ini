# AZAZAEL ML Configuration
# Machine-readable training and inference settings

[model]
name = "HYDRA"
type = "hierarchical_clustering"
version = "1.0.0"

[training]
epochs = 100
batch_size = 32
validation_split = 0.2
early_stopping_patience = 10

[hyperparameters]
n_clusters = 6
linkage = "ward"
metric = "euclidean"
n_neighbors = 5

[optimization]
algorithm = "bayesian"
n_trials = 100
timeout_seconds = 600

[metrics]
primary = "accuracy"
secondary = ["loss", "f1_score", "precision", "recall"]

[inference]
batch_size = 64
max_sequence_length = 512
dtype = "float32"
device = "cpu"
