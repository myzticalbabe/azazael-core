name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch protection on `main` requires a status-check context named exactly
  # `ci`. Until this job existed this workflow only published a check named
  # `test` (the job id), so the required context could never be reported and
  # PR #1 sat at MERGEABLE/BLOCKED with every run green -- the check that
  # protection waits on simply was not being produced.
  # The job id below IS the check name; renaming it re-breaks the gate.
  #
  # The blocking steps are the ones that can be honest today: every test module
  # must import, and the project's own aggregate gate must report no NEW
  # cross-file failure against the isolation baseline. The full single-process
  # suite is NOT here -- see `full-suite-report`.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `pyproject.toml` declares the agnostic floor: `requires-python =
      # ">=3.13"`. Pinning below the floor makes `pip install -e .` fail before
      # a single test runs, and pinning a free-threaded build the hosted runner
      # cannot install is worse -- it fails at setup. 3.13 is the floor.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi
          if [ -f pyproject.toml ]; then
            # The declared floor may be newer than the newest interpreter a hosted
            # runner can install (several of these projects target free-threaded
            # builds). Ignoring the floor here tests the code on the runner; it does
            # not change the supported-version claim in pyproject.toml.
            python -m pip install --ignore-requires-python -e ".[test]" \
              || python -m pip install --ignore-requires-python -e . \
              || echo "::warning::editable install failed; tests will run against the source tree"
          fi
          # A bare editable install brings no pytest; the 2026-11 run of this
          # job proved the fallback path can leave the runner with nothing to
          # measure. This is the floor that keeps `ci` from passing vacuously.
          python -m pip install pytest pytest-timeout

      # BLOCKING. A collection error is a test the suite never runs, so this is
      # the cheapest honest assertion about the tree: every test module imports.
      - name: Collection check (no import errors)
        run: |
          if python -m pytest tests/ --collect-only -q > /tmp/collect.txt 2>&1; then
            tail -2 /tmp/collect.txt
          else
            echo "::error::pytest could not collect the suite"
            grep -E "^(ERROR|E  )" /tmp/collect.txt | head -40
            tail -20 /tmp/collect.txt
            exit 1
          fi

      # BLOCKING, and the project's own instrument rather than a second thinner
      # one: `tools/aggregate_suite_gate.py` compares against
      # `logs/aggregate_isolation_baseline.json` and fails only on a NEW
      # aggregate failure. The isolation profile is the dependency-light subset
      # the tool documents as reproducible off the development machine.
      # Verified on this branch 2026-11-15: 0 failed / 225 passed / 0 errors,
      # 24 skipped, 0 known ids.
      - name: Aggregate isolation gate
        run: python tools/aggregate_suite_gate.py --check --profile isolation

      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            python -m pip install basedpyright && basedpyright --version
          fi

  # NOT required by branch protection, deliberately. The full suite is still
  # being worked down file by file; blocking on it today would only teach
  # people to ignore a red check. It runs so the number is visible on every PR
  # instead of living in a log. Make it required -- and delete the
  # `continue-on-error` -- once the count reaches zero.
  #
  # Two flags are not cosmetic:
  #   --timeout=300        the committed `timeout = 120` is a per-test ceiling;
  #                        300 keeps a slow-but-legitimate file from being scored
  #                        as a hang in this report-only job.
  #   -o faulthandler_timeout=120
  #                        THIS is the 2026-11-15 segfault. The committed value is
  #                        20 s; the dump showed the interrupt landing inside
  #                        `CORE/WORMS/expansion/cutting_edge_model.py:217` (a
  #                        `sum(x*y for x,y in zip(...))`) and the interpreter
  #                        dying with `exit code 139` instead of printing the dump.
  #                        Raising the dump threshold past the per-test ceiling
  #                        means faulthandler only fires when a test has already
  #                        exceeded its own budget.
  full-suite-report:
    name: full suite (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi
          if [ -f pyproject.toml ]; then
            python -m pip install --ignore-requires-python -e ".[test]" \
              || python -m pip install --ignore-requires-python -e . \
              || echo "::warning::editable install failed; tests will run against the source tree"
          fi
          python -m pip install pytest pytest-timeout
      - name: Full suite
        run: |
          python -m pytest tests/ -q --tb=line -p no:cacheprovider \
            --timeout=300 -o faulthandler_timeout=120 2>&1 | tail -60
