[metadata]
name = azazael
version = 1.0.0
description = Azazael — self-replicating AI worm ecosystem for autonomous system administration
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Operating System :: Microsoft :: Windows

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.14
install_requires =
    psutil>=7.2.2,<8

# PRODUCTION is the free-threaded 3.15t build (2026-10-19): the GIL-disabled
# build is what makes concurrent worm execution (CLUSTERWORMS, CONCURRENCY)
# actually parallel. Standard 3.15 (GIL on) also works with degraded
# performance. python_requires stays >=3.14 because the package still runs on
# the one sanctioned 3.14 fallback venv (.venvs/py314m); the retired 3.14t venv
# is not a supported target.

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    azazael-ctl = CORE.azazael_ctl:main
    azazael-doctor = CORE.doctor:cmd_doctor
    azazael-maintain = CORE.data_retention:cmd_maintain
    azazael-observability = CORE.metrics:cmd_metrics
    azazael-backup = CORE.backup:incremental_backup
    azazael-doctor-full = CORE.doctor:run_all
